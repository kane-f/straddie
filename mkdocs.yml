site_name: The Lookout Beach House — Guest Guide
site_description: Everything you need to know to enjoy your stay at The Lookout Beach House, Point Lookout, North Stradbroke Island.
site_url: https://kane-f.github.io/straddie/
repo_url: https://github.com/kane-f/straddie
repo_name: kane-f/straddie
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: en
  - tags
  - git-revision-date-localized:
      enable_creation_date: false
      fallback_to_build_date: true
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# The ?v= query string is manual cache-busting: unlike mkdocs-material's
# own bundled CSS/JS (served under content-hashed filenames), this file
# is served under a stable URL with no cache-busting of its own — a
# browser (or CDN) that already cached an older copy has no reason to
# re-fetch it just because we deployed new HTML that expects new rules
# in it. That mismatch (new markup, stale styling) can look like content
# is missing or broken. Bump this number whenever extra.css changes.
extra_css:
  - stylesheets/extra.css?v=4

extra:
  generator: false

nav:
  - Home: index.md
  - Before You Come: before-you-come/index.md
  - House Guide:
      - Overview: house/index.md
      - Kitchen: house/kitchen/index.md
      - Dining Room: house/dining/index.md
      - Upstairs Living Room: house/living-upstairs/index.md
      - Downstairs Living Room: house/living-downstairs/index.md
      - Balcony: house/balcony/index.md
      - Bedrooms:
          - Overview: house/bedrooms/index.md
          - Flinders: house/bedrooms/flinders/index.md
          - Frenchmans: house/bedrooms/frenchmans/index.md
          - Cylinder: house/bedrooms/cylinder/index.md
          - Main: house/bedrooms/main/index.md
  - Appliances & Tech:
      - Appliances:
          - Overview: appliances/index.md
          - BBQ: appliances/bbq.md
      - Technology & Wi-Fi: technology/index.md
  - Island Guide:
      - Overview: island/index.md
      - Beaches & Swimming: island/beaches-and-swimming/index.md
      - Food & Drink: island/food-and-drink/index.md
      - Things To Do: island/things-to-do/index.md
      - Practical Info: island/practical/index.md
  - Before You Leave: before-you-leave/checkout.md
  - Need Help?: help/index.md
  - Photo Gallery: gallery/index.md
