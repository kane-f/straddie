<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Sky and ocean horizon">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b3d3f"/>
      <stop offset="55%" stop-color="#146b6e"/>
      <stop offset="80%" stop-color="#3aa6a0"/>
      <stop offset="100%" stop-color="#f4c76b"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9b8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1180" cy="640" r="220" fill="url(#sun)"/>
  <circle cx="1180" cy="640" r="70" fill="#fff3d6" opacity="0.9"/>
  <g fill="#ffffff" opacity="0.18">
    <ellipse cx="260" cy="180" rx="140" ry="26"/>
    <ellipse cx="360" cy="200" rx="90" ry="18"/>
    <ellipse cx="820" cy="120" rx="110" ry="20"/>
    <ellipse cx="900" cy="140" rx="70" ry="14"/>
  </g>
</svg>
