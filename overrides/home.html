{% extends "main.html" %}

{% block content %}
<div class="hero-page">
  <div class="hero">
    <img class="hero__image" src="{{ 'assets/images/hero/layer-1-background.jpg' | url }}" alt="" loading="eager">
    <img class="hero__grass" src="{{ 'assets/images/hero/layer-2-grass.webp' | url }}" alt="" loading="eager">
    <div class="hero__scrim"></div>
    <div class="hero__inner md-grid">
      <div class="hero__teaser">
        <h1>The Lookout Beach House</h1>
        <p>Your guest guide to Point Lookout, North Stradbroke Island — everything you need, in seconds.</p>
        <a href="#start-here" class="md-button md-button--primary">Start Here</a>
        <a href="{{ 'help/' | url }}" class="md-button">Need Help?</a>
      </div>
    </div>
    <a href="#start-here" class="hero__more" aria-label="Scroll down to start here">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M11 4h2v12l5.5-5.5 1.42 1.42L12 19.84l-7.92-7.92L5.5 10.5 11 16z"/></svg>
    </a>
  </div>

  {{ super() }}
</div>
<script>
  // Both fixes below share one shape: pure CSS can't know the real
  // offset (an asymmetric ancestor horizontally, a header height that
  // changes across breakpoints vertically), so measure the residual gap
  // and nudge the margin to close it. Neither is a per-frame/scroll
  // handler — just a one-off correction on load and on resize.
  (function () {
    function fixHeroBleed() {
      // The CSS `left: 50%; margin-left: -50vw` full-bleed trick assumes
      // .hero's containing block is horizontally centred in the
      // viewport. That's only true when mkdocs-material's left nav and
      // right TOC sidebars are either both showing or both collapsed —
      // at widths where only one has appeared (its breakpoint differs
      // from the other's), the content column sits off-centre and the
      // trick leaves the hero short of one edge with a gap on the
      // other.
      var hero = document.querySelector(".hero");
      if (!hero) return;
      var gap = hero.getBoundingClientRect().left;
      if (Math.abs(gap) > 0.5) {
        var current = parseFloat(getComputedStyle(hero).marginLeft) || 0;
        hero.style.marginLeft = current - gap + "px";
      }
    }

    function fixHeroTop() {
      // .hero is pulled up with a negative margin-top so it starts at
      // the very top of the page (behind the sticky header) rather than
      // just below it — otherwise its fixed 100dvh height would run
      // that same amount past the bottom of the screen. The header's
      // real height varies (the tabs row shown on wide screens adds to
      // it, and it's hidden on mobile), so a hardcoded margin drifts out
      // of sync and leaves the hero short at the bottom. Measure where
      // the top of the page actually is instead of guessing.
      var hero = document.querySelector(".hero");
      if (!hero) return;
      var docTop = hero.getBoundingClientRect().top + window.scrollY;
      if (Math.abs(docTop) > 0.5) {
        var current = parseFloat(getComputedStyle(hero).marginTop) || 0;
        hero.style.marginTop = current - docTop + "px";
      }
    }

    function fixHeroLayout() {
      fixHeroBleed();
      fixHeroTop();
    }

    fixHeroLayout();
    window.addEventListener("resize", fixHeroLayout);
  })();

  // Two-layer parallax: the background and grass images each shift up
  // by a fraction of how far we've scrolled into the hero, the grass
  // (nearer, foreground) faster than the background (farther away) —
  // that difference in speed is what reads as depth. Only two rAF-batched
  // scroll reads/writes per frame, and it stops touching the DOM once
  // the hero has scrolled out of view, so it's not the kind of
  // per-frame layout work the old 3D-transform version suffered from.
  (function () {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var hero = document.querySelector(".hero");
    var bg = document.querySelector(".hero__image");
    var grass = document.querySelector(".hero__grass");
    if (!hero || !bg || !grass) return;

    var MAX_SCROLL = 300; // px of scroll over which the effect ramps up
    var BG_SPEED = 0.06;
    var GRASS_SPEED = 0.16;
    var ticking = false;

    function update() {
      ticking = false;
      var rect = hero.getBoundingClientRect();
      if (rect.bottom <= 0 || rect.top >= window.innerHeight) return;
      var scrolled = Math.min(MAX_SCROLL, Math.max(0, -rect.top));
      bg.style.transform = "translateY(" + -(scrolled * BG_SPEED) + "px)";
      grass.style.transform = "translateY(" + -(scrolled * GRASS_SPEED) + "px)";
    }

    function onScroll() {
      if (!ticking) {
        window.requestAnimationFrame(update);
        ticking = true;
      }
    }

    update();
    window.addEventListener("scroll", onScroll, { passive: true });
  })();
</script>
{% endblock %}
