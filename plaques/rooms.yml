# Registry of room door plaques.
#
# Each entry describes one 5x7" plaque: what it's called, which page it
# links to (via QR code), and which photo to use as the background.
#
# `url` is a path relative to `site_url` in mkdocs.yml — the generator
# builds the full QR link from the two, so this file never needs the
# domain hardcoded in it.
#
# `background` is a path relative to the repo root. The images below are
# reused from the existing room galleries as placeholders — swap in a
# dedicated vertical shot per room whenever one is available (see
# plaques/README.md for the crop the template expects).
#
# `kicker` is optional small-caps text shown above the room name (used
# for the bedrooms, which are named after beaches, and for the two
# living rooms, which share a name and are told apart by floor).
#
# `color` / `color_name` are the room's plaque background colour — a
# beach/coastal-themed palette, one hue per room, documented in full in
# plaques/DESIGN-SYSTEM.md. Colours range from pale sand/foam to deep
# ocean/night, on purpose (a real beach spans both) — the generator picks
# legible ink (white or dark teal) and an accent shade automatically per
# colour, computed from contrast, so no per-room text-colour choice is
# needed here.

rooms:
  - slug: kitchen
    name: Kitchen
    url: house/kitchen/
    background: docs/assets/images/house/kitchen/kitchen-island-and-cooktop.jpg
    color: "#35b6ad"
    color_name: Lagoon Turquoise

